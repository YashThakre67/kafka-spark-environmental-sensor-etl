# TODO: Docker Compose configuration will be added.

services:
  spark-master:
    image: spark:python3
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8085:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./output:/opt/spark-output
      - ./results:/opt/spark-results
      - ./cache/ivy:/opt/spark/.ivy2
      - ./cache/m2:/opt/spark/.m2

  spark-worker-1:
    image: spark:python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 1
      --memory 1g
    ports:
      - "8081:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./output:/opt/spark-output
      - ./results:/opt/spark-results

  spark-worker-2:
    image: spark:python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082
      --cores 1
      --memory 1g
    ports:
      - "8082:8082"
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./output:/opt/spark-output
      - ./results:/opt/spark-results

  spark-worker-3:
    image: spark:python3
    container_name: spark-worker-3
    hostname: spark-worker-3
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8083
      --cores 1
      --memory 1g
    ports:
      - "8083:8083"
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./output:/opt/spark-output
      - ./results:/opt/spark-results

  spark-worker-4:
    image: spark:python3
    container_name: spark-worker-4
    hostname: spark-worker-4
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8084
      --cores 1
      --memory 1g
    ports:
      - "8084:8084"
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./output:/opt/spark-output
      - ./results:/opt/spark-results

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
